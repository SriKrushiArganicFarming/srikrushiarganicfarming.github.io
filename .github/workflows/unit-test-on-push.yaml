name: unit-test-on-push
run-name: Unit Test on Push
description: Run unit tests on push to main branch

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test
